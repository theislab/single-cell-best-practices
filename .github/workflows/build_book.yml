name: Build book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: preview-${{ github.ref }}

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup environment
        run: |
          pip install uv
          uv pip install --system "jupyter-book==2.1.6" jupytext beautifulsoup4

      - name: Insert dropdowns to all chapters
        run: make dropdown

      - name: Build the JupyterBook
        run: make build

  pdfhtml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade uv
          uv pip install --system jupyter-book==2.1.6 jupytext beautifulsoup4

      - name: Install LaTeX and the image converters myst shells out to
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            imagemagick \
            librsvg2-bin \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-plain-generic \
            texlive-xetex \
            texlive-extra-utils

      - name: Build PDF
        run: make pdf

      - uses: actions/upload-artifact@v7
        with:
          name: PDF_HTML
          path: jupyter-book/exports/book.pdf
          if-no-files-found: error
