version: 1
project:
  title: Single-cell best practices
  authors:
    - name: Lukas Heumos
    - name: Anna Schaar
    - name: single-cell best practices consortium
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - figures
    - datasets
    - README.md
  github: theislab/single-cell-best-practices
  bibliography:
    - preamble.bib
    - outlook.bib
    - introduction/prior_art.bib
    - introduction/raw_data_processing.bib
    - introduction/scrna_seq.bib
    - introduction/fundamental_data_structures_and_frameworks.bib
    - introduction/advanced_data_structures_and_frameworks.bib
    - introduction/data_structures_and_frameworks_advanced.bib
    - preprocessing_visualization/quality_control.bib
    - preprocessing_visualization/normalization.bib
    - preprocessing_visualization/feature_selection.bib
    - preprocessing_visualization/dimensionality_reduction.bib
    - cellular_structure/annotation.bib
    - cellular_structure/clustering.bib
    - cellular_structure/integration.bib
    - trajectories/lineage_tracing.bib
    - trajectories/pseudotemporal.bib
    - trajectories/rna_velocity.bib
    - conditions/differential_gene_expression.bib
    - conditions/compositional.bib
    - conditions/gsea_pathway.bib
    - conditions/perturbation_modeling.bib
    - mechanisms/cell_cell_communication.bib
    - mechanisms/gene_regulatory_networks.bib
    - deconvolution/bulk_deconvolution.bib
    - chromatin_accessibility/introduction.bib
    - chromatin_accessibility/quality_control.bib
    - chromatin_accessibility/gene_regulatory_networks_atac.bib
    - surface_protein/references.bib
    - air_repertoire/references.bib
    - multimodal_integration/paired_integration.bib
    - multimodal_integration/advanced_integration.bib
    - spatial/spatial.bib
    - template/template.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: preamble.md
    - title: Introduction
      children:
        - file: introduction/prior_art.md
        - file: introduction/scrna_seq.ipynb
        - file: introduction/raw_data_processing.md
        - file: introduction/fundamental_data_structures_and_frameworks.ipynb
        - file: introduction/advanced_data_structures_and_frameworks.ipynb
        - file: introduction/interoperability.ipynb
    - title: Preprocessing and visualization
      children:
        - file: preprocessing_visualization/quality_control.ipynb
        - file: preprocessing_visualization/normalization.ipynb
        - file: preprocessing_visualization/feature_selection.ipynb
        - file: preprocessing_visualization/dimensionality_reduction.ipynb
    - title: Identifying cellular structure
      children:
        - file: cellular_structure/clustering.ipynb
        - file: cellular_structure/annotation.ipynb
        - file: cellular_structure/integration.ipynb
    - title: Inferring trajectories
      children:
        - file: trajectories/pseudotemporal.ipynb
        - file: trajectories/rna_velocity.ipynb
        - file: trajectories/lineage_tracing.ipynb
    - title: Dealing with conditions
      children:
        - file: conditions/differential_gene_expression.ipynb
        - file: conditions/compositional.ipynb
        - file: conditions/gsea_pathway.ipynb
        - file: conditions/perturbation_modeling.ipynb
    - title: Modeling mechanisms
      children:
        - file: mechanisms/gene_regulatory_networks.ipynb
        - file: mechanisms/cell_cell_communication.ipynb
    - title: Deconvolution
      children:
        - file: deconvolution/bulk_deconvolution.ipynb
    - title: Chromatin Accessibility
      children:
        - file: chromatin_accessibility/introduction.ipynb
        - file: chromatin_accessibility/quality_control.ipynb
        - file: chromatin_accessibility/gene_regulatory_networks_atac.ipynb
    - title: Spatial omics
      children:
        - file: spatial/introduction.ipynb
        - file: spatial/neighborhood.ipynb
        - file: spatial/domains.ipynb
        - file: spatial/spatially_variable_genes.ipynb
        - file: spatial/deconvolution.ipynb
        - file: spatial/imputation.ipynb
    - title: Surface protein
      children:
        - file: surface_protein/quality_control.ipynb
        - file: surface_protein/normalization.ipynb
        - file: surface_protein/doublet_detection.ipynb
        - file: surface_protein/dimensionality_reduction.ipynb
        - file: surface_protein/batch_correction.ipynb
        - file: surface_protein/annotation.ipynb
    - title: Adaptive immune receptor repertoire
      children:
        - file: air_repertoire/ir_profiling.ipynb
        - file: air_repertoire/clonotype.ipynb
        - file: air_repertoire/specificity.ipynb
        - file: air_repertoire/multimodal_integration.ipynb
    - title: Multimodal integration
      children:
        - file: multimodal_integration/paired_integration.ipynb
        - file: multimodal_integration/advanced_integration.ipynb
    - title: Outlook
      children:
        - file: outlook.md
    - title: Acknowledgements
      children:
        - file: acknowledgements.md
    - title: Glossary
      children:
        - file: glossary.md
    - title: Changelog
      children:
        - file: CHANGELOG.md
          title: Changelog
site:
  options:
    logo: logo.png
    favicon: _static/favicon.ico
    folders: true
  template: book-theme
