version: 1
project:
  settings:
    output_matplotlib_strings: remove
  references:
    python:
      url: https://docs.python.org/3
    numpy:
      url: https://numpy.org/doc/stable
    pandas:
      url: https://pandas.pydata.org/docs
    scipy:
      url: https://docs.scipy.org/doc/scipy
    matplotlib:
      url: https://matplotlib.org/stable
    seaborn:
      url: https://seaborn.pydata.org
    sklearn:
      url: https://scikit-learn.org/stable
    ipython:
      url: https://ipython.readthedocs.io/en/stable
    rpy2:
      url: https://rpy2.github.io/doc/latest/html
    anndata:
      url: https://anndata.readthedocs.io/en/stable
    scanpy:
      url: https://scanpy.readthedocs.io/en/stable
    mudata:
      url: https://mudata.readthedocs.io/stable
    muon:
      url: https://muon.readthedocs.io/en/stable
    squidpy:
      url: https://squidpy.readthedocs.io/en/stable
    spatialdata:
      url: https://spatialdata.scverse.org/en/stable
    scirpy:
      url: https://scirpy.scverse.org/en/stable
    scvi:
      url: https://docs.scvi-tools.org/en/stable
    scarches:
      url: https://scarches.readthedocs.io/en/latest
    pertpy:
      url: https://pertpy.readthedocs.io/en/latest
    decoupler:
      url: https://decoupler.readthedocs.io/en/latest
    liana:
      url: https://liana-py.readthedocs.io/en/latest
    omnipath:
      url: https://omnipath.readthedocs.io/en/latest
    scvelo:
      url: https://scvelo.readthedocs.io/en/stable
    cellrank:
      url: https://cellrank.readthedocs.io/en/stable
    palantir:
      url: https://palantir.readthedocs.io/en/latest
    dynamo:
      url: https://dynamo-release.readthedocs.io/en/latest
    hotspot:
      url: https://hotspot.readthedocs.io/en/latest
    cell2location:
      url: https://cell2location.readthedocs.io/en/latest
    tangram:
      url: https://tangram-sc.readthedocs.io/en/latest
