myst: v1
title: Single-cell best practices
description: The plain_latex_book template with figures in dropdowns and a complete glossary
version: "1.0.0"
authors:
  - name: Rowan Cockett
    website: https://row1.ca
    affiliations:
      - Curvenote
      - Executable Books
license: CC-BY-4.0
tags:
  - book
# parts:
