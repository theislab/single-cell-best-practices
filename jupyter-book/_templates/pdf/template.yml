doc:
  - id: title
    required: true
  - id: subtitle
  - id: authors
    required: true
  # - id: keywords
  #   description: |
  #     Include a list of keywords after the abstract (minimum 3)
  - id: bibliography
# options:
#   - id: double_spacing
#     title: Double line spacing
#     type: boolean
#     description: Enable double line spacing
#     default: false
files:
  - template.tex
packages:
  - babel
  - caption
  - enumitem
  - framed
  - geometry
  - graphicx
  - hyperref
  - natbib
  - xcolor
  - changepage
  - amssymb
  - ulem
  - etoolbox
  - fontspec
