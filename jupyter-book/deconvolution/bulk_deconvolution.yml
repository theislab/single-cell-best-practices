name: bulk-deconvolution
channels:
  - conda-forge
dependencies:
  - conda-forge::ipykernel=7.3.0
  - conda-forge::ipywidgets=8.1.9
  - conda-forge::python=3.12.16
  - pip
  - pip:
      - lamindb==2.12.2
